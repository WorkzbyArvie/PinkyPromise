; ---------------------------------------------------------------------------
; Overrides for the vercel-php runtime. Removed during the Vercel build.
;
; The default runtime already sets memory_limit to ~90M, which is far too
; little for a 4 MB upload plus PDO. 1024M matches the function's memory
; setting in vercel.json.
; ---------------------------------------------------------------------------

memory_limit = 1024M

; A 4 MB ceiling; api/upload.php enforces the same limit and refuses
; anything larger before reading it.
upload_max_filesize = 6M
post_max_size = 6M
max_file_uploads = 4

; Long enough for a slow connection to push 4 MB to Supabase.
max_execution_time = 60

; Never leak internals into a JSON response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = php://stderr
error_reporting = E_ALL

; This app never shells out. Belt and braces: even if a future dependency
; tries, these functions are not reachable.
disable_functions = exec,system,shell_exec,passthru,popen,proc_open,pcntl_exec

; Sensible defaults for a JSON API.
default_charset = "UTF-8"
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 0